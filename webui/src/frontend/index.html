<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta http-equiv="Pragma" content="no-cache">
<meta name="color-scheme" content="light dark">
<title>Роутер</title>
<script>
(function () {
  var t = '';
  try { t = localStorage.getItem('m.theme') || ''; } catch (e) {}
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="/css/mod/app.css">
</head>
<body>
<div id="app"><div class="boot">Загрузка…</div></div>
<noscript>Для работы интерфейса нужен JavaScript.</noscript>
<script src="/js/mod/app.js"></script>
</body>
</html>
